
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: frauddetector
          POSTGRES_USER: frauddetector
          POSTGRES_PASSWORD: frauddetector
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U frauddetector -d frauddetector"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_URL: jdbc:postgresql://localhost:5432/frauddetector
      DB_USERNAME: frauddetector
      DB_PASSWORD: frauddetector
      KAFKA_BOOTSTRAP_SERVERS: localhost:9092

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission to Gradle wrapper
        run: chmod +x gradlew

      - name: Run complete test suite
        run: ./gradlew --no-daemon clean test
