spring.application.name=fraud-detector

# ============================================================
# SERVER
# ============================================================

server.port=8080


# ============================================================
# DATABASE
# ============================================================

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/frauddetector}
spring.datasource.username=${DB_USERNAME:frauddetector}
spring.datasource.password=${DB_PASSWORD:frauddetector}

spring.datasource.driver-class-name=org.postgresql.Driver


# ============================================================
# JPA / HIBERNATE
# ============================================================

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC


# ============================================================
# ACTUATOR
# ============================================================

management.endpoints.web.exposure.include=health,info,metrics

management.endpoint.health.show-details=when_authorized


# ============================================================
# OPENAPI / SWAGGER
# ============================================================

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html


# ============================================================
# LOGGING
# ============================================================

logging.level.root=INFO
logging.level.com.frauddetector=DEBUG